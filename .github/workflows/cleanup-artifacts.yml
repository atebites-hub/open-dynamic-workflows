name: Cleanup artifacts

on:
  schedule:
    # Monday ~12 UTC. Minute 23 matches this fork's other scheduled job.
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: open-dynamic-workflows-cleanup-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'atebites-hub/open-dynamic-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete artifacts older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          cutoff_iso="$(date -u -d '3 days ago' --iso-8601=seconds)"
          cutoff_epoch="$(date -u -d '3 days ago' +%s)"

          echo "Repository: ${repo}"
          echo "Deleting artifacts created before ${cutoff_iso} (older than 3 days)"

          total="$(gh api "/repos/${repo}/actions/artifacts?per_page=1" --jq '.total_count')"
          echo "Artifact count: ${total}"

          if [[ "${total}" -eq 0 ]]; then
            echo "No artifacts; nothing to delete"
            exit 0
          fi

          mapfile -t rows < <(
            gh api --paginate "/repos/${repo}/actions/artifacts?per_page=100" \
              --jq --argjson cutoff "${cutoff_epoch}" '
                .artifacts[]
                | select(.expired | not)
                | select((.created_at | fromdateiso8601) < $cutoff)
                | [.id, .name, .created_at] | @tsv
              '
          )

          if [[ ${#rows[@]} -eq 0 ]]; then
            echo "No artifacts older than 3 days; nothing to delete"
            exit 0
          fi

          deleted=0
          for row in "${rows[@]}"; do
            id="${row%%$'\t'*}"
            rest="${row#*$'\t'}"
            name="${rest%%$'\t'*}"
            created="${rest#*$'\t'}"
            echo "Deleting artifact id=${id} name=${name} created=${created}"
            gh api -X DELETE "/repos/${repo}/actions/artifacts/${id}"
            deleted=$((deleted + 1))
          done

          echo "Deleted ${deleted} artifact(s)"
